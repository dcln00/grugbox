backend:
  name: github
  branch: main
  repo: dcln00/grugbox
  base_url: https://sveltia-cms-auth.nii-aryh.workers.dev
  open_authoring: true

media_folder: public/content
public_folder: /content
site_url: https://www.grugbox.world
site_name: Grugbox
publish_mode: editorial_workflow

collections:
  - name: 'post'
    slug: '{{slug}}'
    label: 'Posts'
    label_singular: 'Post'
    icon: 'sticky_note_2'
    folder: 'content/articles'
    format: 'frontmatter'
    create: true
    identifier_field: "title"
    editor:
      preview: true
      default:
        field: date
        direction: descending
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Description', name: 'description', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - label: 'Author'
        name: 'author'
        widget: 'select'
        default: 'Grugbox'
        hint: 'Rendered as the byline. The author list is repeated in all four collections — add a new name to each.'
        options:
          - Grugbox
          - Nii Aryeh
      - { label: 'Featured Image', name: 'image', widget: 'image', required: false }
      - { label: 'Tags', name: 'tags', widget: 'list', required: false, hint: 'Add tags like trending, lifestyle, etc..',}
      - label: 'Category'
        name: 'category'
        widget: 'select'
        hint: 'How this piece is classified on the site.'
        options:
          - { label: 'Feature', value: 'feature' }
          - { label: 'Editorial', value: 'editorial' }
          - { label: 'Profile', value: 'profile' }
          - { label: 'Event', value: 'event' }
          - { label: 'Screen', value: 'screen' }
      - { label: 'Body', name: 'body', widget: 'markdown' }

  - name: 'review'
    slug: '{{slug}}'
    label: 'Reviews'
    label_singular: 'Review'
    icon: 'rate_review'
    folder: 'content/reviews'
    format: 'frontmatter'
    create: true
    identifier_field: "title"
    editor:
      preview: true
      default:
        field: date
        direction: descending
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Album / Project Title', name: 'albumTitle', widget: 'string', required: false, hint: 'Title of the album, EP, or project for the scoreboard' }
      - { label: 'Description', name: 'description', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - label: 'Author'
        name: 'author'
        widget: 'select'
        default: 'Grugbox'
        hint: 'Rendered as the byline. The author list is repeated in all four collections — add a new name to each.'
        options:
          - Grugbox
          - Nii Aryeh
      - { label: 'Featured Image', name: 'image', widget: 'image', required: true, hint: 'Required — the review page and its Open Graph tags both render it.' }
      - { label: 'Tags', name: 'tags', widget: 'list', required: false, hint: 'Add tags like album, ep, single, etc..',}
      - { label: 'Score', name: 'score', widget: 'number', required: false, min: 1, max: 10, hint: 'Score out of 10. Leave blank for reviews that are not scored.' }
      - { label: 'Release Date', name: 'releaseDate', widget: 'string', required: false, hint: 'e.g. November 21, 2025' }
      - { label: 'Key Tracks', name: 'keyTracks', widget: 'list', required: false, hint: 'List of standout tracks' }
      - { label: 'The Good', name: 'good', widget: 'list', required: false, hint: 'Highlights and strengths' }
      - { label: 'The Bad', name: 'bad', widget: 'list', required: false, hint: 'Criticisms or drawbacks' }
      - { label: 'Body', name: 'body', widget: 'markdown' }

  - name: 'interview'
    slug: '{{slug}}'
    label: 'Interviews'
    label_singular: 'Interview'
    icon: 'record_voice_over'
    folder: 'content/interviews'
    format: 'frontmatter'
    create: true
    identifier_field: "title"
    editor:
      preview: true
      default:
        field: date
        direction: descending
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - label: 'Author'
        name: 'author'
        widget: 'select'
        default: 'Grugbox'
        hint: 'Rendered as the byline. The author list is repeated in all four collections — add a new name to each.'
        options:
          - Grugbox
          - Nii Aryeh
      - { label: 'Featured Image', name: 'image', widget: 'image', required: true, hint: 'Required — the interview page and its Open Graph tags both render it.' }
      - { label: 'Tags', name: 'tags', widget: 'list', required: false, hint: 'Add tags like trending, lifestyle, etc..',}
      - { label: 'Body', name: 'body', widget: 'markdown' }

  - name: 'playlist'
    slug: '{{slug}}'
    label: 'Playlists'
    label_singular: 'Playlist'
    icon: 'play_arrow'
    folder: 'content/playlists'
    format: 'frontmatter'
    create: true
    identifier_field: "title"
    editor:
      preview: true
      default:
        field: date
        direction: descending
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Description', name: 'description', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - label: 'Author'
        name: 'author'
        widget: 'select'
        default: 'Grugbox'
        hint: 'Rendered as the byline. The author list is repeated in all four collections — add a new name to each.'
        options:
          - Grugbox
          - Nii Aryeh
      - { label: 'Featured Image', name: 'image', widget: 'image', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown' }