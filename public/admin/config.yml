backend:
  name: github
  branch: main
  repo: dcln00/grugbox
  base_url: https://sveltia-cms-auth.nii-aryh.workers.dev

media_folder: public/articles
public_folder: /articles
site_url: https://www.grugbox.world
site_name: Grugbox

collections:
  - name: 'post'
    label: 'Posts'
    folder: 'content/articles'
    format: 'frontmatter'
    create: true
    identifier_field: "title"
    editor:
      preview: false
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Description', name: 'description', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Featured Image', name: 'image', widget: 'image', required: false }
      - { label: 'Tags', name: 'tags', widget: 'list', allow_add: true, required: false, hint: 'Add tags like trending, lifestyle, etc.' }
      - { label: 'Body', name: 'body', widget: 'markdown' }